name: CPU reference checks
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    env:
      OMP_WAIT_POLICY: PASSIVE
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python python/reference.py tests/triangle.txt --oracle
      - run: cmake -S . -B build-cpu -DTC_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cpu -j 2
      - run: python tests/check_serial.py ./build-cpu/tc_cpu_serial
      - run: ctest --test-dir build-cpu --output-on-failure
      - run: python tests/check_preprocess_profile.py ./build-cpu/tc_cpu_serial
      - run: python tests/check_preprocess_modes.py ./build-cpu/tc_cpu_serial ./build-cpu/tc_preprocess_equivalence
      - run: python tests/check_serial.py ./build-cpu/tc_cpu_serial --parser omp --mapping omp --sort omp --threads 4 --check-csr
      - run: python tests/check_preprocess_profile.py ./build-cpu/tc_cpu_serial --parser omp --mapping omp --sort omp --threads 4 --check-csr
